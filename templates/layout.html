<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f4">
    <title>{% if title %}{{ title }} | Civic Vote{% else %}Civic Vote | Make your voice count{% endif %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <script src="{{ url_for('static', path='js/theme.js') }}"></script>
</head>
<body data-bs-theme="light">
    <header class="site-header">
        <nav class="navbar navbar-expand-lg container py-3" aria-label="Main navigation">
            <a class="navbar-brand civic-brand d-flex align-items-center gap-2" href="/">
                <span class="civic-brand-mark"><i class="bi bi-check2" aria-hidden="true"></i></span>
                <span>civic<span class="brand-word-light">vote</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNavigation" aria-controls="siteNavigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="siteNavigation">
                <ul class="navbar-nav ms-lg-5 me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Election</a></li>
                    <li class="nav-item"><a class="nav-link" href="/results">Results</a></li>
                </ul>
                <div class="header-actions d-flex align-items-center gap-3 mt-3 mt-lg-0">
                    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme" title="Switch theme">
                        <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
                    </button>
                    {% if user %}
                    <span class="nav-user d-none d-sm-inline">Hi, {{ user.username }}</span>
                    <form action="/logout" method="post" class="d-inline">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <button class="btn btn-outline-civic btn-sm" type="submit">Sign out</button>
                    </form>
                    {% else %}
                    <a class="btn btn-outline-civic btn-sm" href="/login">Sign in</a>
                    <a class="btn btn-civic btn-sm" href="/register">Create account</a>
                    {% endif %}
                </div>
            </div>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
            <a class="footer-brand" href="/">civic<span>vote</span></a>
            <p class="mb-0">One person. One vote. A stronger community.</p>
            <span class="footer-copyright">© 2026 Civic Vote</span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
